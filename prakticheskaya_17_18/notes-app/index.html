<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4285f4">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Мои заметки</title>
    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    <link rel="icon" href="/icons/favicon.ico" type="image/x-icon">
    <style>
        body {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #4285f4;
            text-align: center;
            margin-bottom: 10px;
        }
        .no-break {
            white-space: nowrap;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .tab {
            background-color: #e0e0e0;
            color: #333;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 16px;
        }
        .tab.active {
            background-color: #4285f4;
            color: white;
        }
        #app-content {
            margin-top: 2rem;
        }
        footer {
            margin-top: 2rem;
            text-align: center;
        }
        .button.success {
            background-color: #28a745;
        }
        .button.error {
            background-color: #dc3545;
        }
        .notification-toast {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #4285f4;
            color: white;
            padding: 1rem;
            border-radius: 5px;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .status {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 14px;
        }
        .status.online {
            background-color: #d4edda;
            color: #155724;
        }
        .status.offline {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <header>
        <h1>Мои заметки</h1>
        <div id="connection-status" class="status online">Онлайн режим</div>
        <nav class="tabs">
            <button id="home-btn" class="tab active col-6">Главная</button>
            <button id="about-btn" class="tab col-6">О приложении</button>
        </nav>
    </header>
    <main id="app-content"></main>
    <footer class="is-center">
        <button id="enable-push" class="button success">Включить уведомления</button>
        <button id="disable-push" class="button error" style="display:none;">Отключить уведомления</button>
    </footer>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
